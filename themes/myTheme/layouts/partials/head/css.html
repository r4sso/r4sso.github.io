{{- with resources.Get "css/main.css" }}
  {{- if eq hugo.Environment "development" }}
    <link rel="stylesheet" href="{{ .RelPermalink }}">
  {{- else }}
    {{- with . | minify | fingerprint }}
    <link rel="preload" href="{{ .RelPermalink }}" as="style" onload="this.onload=null;this.rel='stylesheet'" integrity="{{ .Data.Integrity }}" crossorigin="anonymous" fetchpriority="high">
    <noscript><link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous"></noscript>
    {{- end }}
  {{- end }}
{{- end }}
<link rel="preload" as="font" href="{{ "fonts/iosevka.woff2" | relURL }}" type="font/woff2" crossorigin="anonymous" fetchpriority="high">
<link rel="preload" as="font" href="{{ "fonts/iosevka-bold.woff2" | relURL }}" type="font/woff2" crossorigin="anonymous">
