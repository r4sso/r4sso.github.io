{{- if or (in .Params.thumb "http") (in .Params.thumb ".gif") -}}
  {{ $src := .Page.Resources.GetMatch (.Params.thumb | safeURL) }}
  <div class="thumb">
    <figure>
      <a href="{{ .Params.thumb }}">
        <picture>
          <img src="{{ .Params.thumb }}" alt="{{ .Params.alt }}" decoding="async" {{ with $src }}width="{{ .Width }}" height="{{ .Height }}"{{ end }}>
        </picture>
      </a>
      {{ with .Params.alt }}<figcaption>- {{ . | markdownify }}</figcaption>{{ end }}
    </figure>
  </div>
{{ else }}
  {{ $src := .Page.Resources.GetMatch (.Params.thumb | safeURL) }}
  {{ if $src }}
  <div class="thumb">
    <figure>
      {{ $data := newScratch }}
      {{ if gt $src.Width 1100 }}
        {{ $data.Set "avif" ($src.Resize "960x avif") }}
        {{ $data.Set "webp" ($src.Resize "960x webp") }}
        {{ $data.Set "fallback" ($src.Resize "960x") }}
      {{ else }}
        {{ $data.Set "avif" ($src.Resize (printf "%dx%d avif" $src.Width $src.Height)) }}
        {{ $data.Set "webp" ($src.Resize (printf "%dx%d webp" $src.Width $src.Height)) }}
        {{ $data.Set "fallback" ($src.Resize (printf "%dx%d" $src.Width $src.Height)) }}
      {{ end }}
      {{ $avif := $data.Get "avif" }}
      {{ $webp := $data.Get "webp" }}
      {{ $fallback := $data.Get "fallback" }}
      <a href="{{ $src.RelPermalink }}">
        <picture>
          <source srcset="{{ $avif.RelPermalink }}" type="image/avif">
          <source srcset="{{ $webp.RelPermalink }}" type="image/webp">
          <img src="{{ $fallback.RelPermalink }}" alt="{{ .Params.alt }}" decoding="async" loading="eager" fetchpriority="high" width="{{ $fallback.Width }}" height="{{ $fallback.Height }}" />
        </picture>
      </a>
      {{ with .Params.alt }}<figcaption>- {{ . | markdownify }}</figcaption>{{ end }}
    </figure>
  </div>
  {{ end }}
{{- end -}}
