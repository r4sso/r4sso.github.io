{{ $src := .Page.Resources.GetMatch (printf "%s" (.Destination | safeURL)) }}

{{ if $src }}
<figure>
  {{ $data := newScratch }}
  {{ if gt $src.Width 1100 }}
    {{ $data.Set "avif" ($src.Resize "960x avif") }}
    {{ $data.Set "webp" ($src.Resize "960x webp") }}
    {{ $data.Set "fallback" ($src.Resize "960x") }}
    {{ $data.Set "avifSmall" ($src.Resize "480x avif") }}
    {{ $data.Set "webpSmall" ($src.Resize "480x webp") }}
    {{ $data.Set "fallbackSmall" ($src.Resize "480x") }}
  {{ else }}
    {{ $data.Set "avif" ($src.Resize (printf "%dx%d avif" $src.Width $src.Height)) }}
    {{ $data.Set "webp" ($src.Resize (printf "%dx%d webp" $src.Width $src.Height)) }}
    {{ $data.Set "fallback" ($src.Resize (printf "%dx%d" $src.Width $src.Height)) }}
  {{ end }}
  {{ $avif := $data.Get "avif" }}
  {{ $webp := $data.Get "webp" }}
  {{ $fallback := $data.Get "fallback" }}
  {{ $isFirst := eq (.Page.Scratch.Get "imgCount") nil }}
  {{ .Page.Scratch.Set "imgCount" 1 }}
  {{ $loading := cond $isFirst "eager" "lazy" }}
  {{ $fetchPriority := cond $isFirst "high" "auto" }}
  <a href="{{ $src.RelPermalink }}">
    <picture>
      {{ if $data.Get "webpSmall" }}
      <source srcset="{{ ($data.Get "avifSmall").RelPermalink }} 480w, {{ $avif.RelPermalink }} 960w" sizes="(max-width: 640px) 100vw, 960px" type="image/avif">
      <source srcset="{{ ($data.Get "webpSmall").RelPermalink }} 480w, {{ $webp.RelPermalink }} 960w" sizes="(max-width: 640px) 100vw, 960px" type="image/webp">
      <source srcset="{{ ($data.Get "fallbackSmall").RelPermalink }} 480w, {{ $fallback.RelPermalink }} 960w" sizes="(max-width: 640px) 100vw, 960px" type="{{ $fallback.MediaType.Type }}">
      {{ else }}
      <source srcset="{{ $avif.RelPermalink }}" type="image/avif">
      <source srcset="{{ $webp.RelPermalink }}" type="image/webp">
      {{ end }}
      <img src="{{ $fallback.RelPermalink }}" alt="{{ .Text }}" loading="{{ $loading }}" decoding="async" fetchpriority="{{ $fetchPriority }}" width="{{ $fallback.Width }}" height="{{ $fallback.Height }}"/>
    </picture>
  </a>
  {{ with .Title }}<figcaption>- {{ . | markdownify }}</figcaption>{{ end }}
</figure>
{{ else }}
  {{/* Fallback for external images */}}
  <img src="{{ .Destination | safeURL }}" alt="{{ .Text }}" loading="lazy" decoding="async" />
{{ end }}
