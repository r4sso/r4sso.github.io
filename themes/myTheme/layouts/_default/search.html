{{ define "main" }}
<div class="search-wrap">
  <div style="max-width:48rem; margin:0 auto;">
    <form id="search" action='{{ with .GetPage "/search" }}{{.RelPermalink}}{{end}}' method="get" class="search-form">
      <div style="position:relative; flex:1;">
        <span class="search-icon">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/></svg>
        </span>
        <input aria-label="Search site" type="text" name="q" placeholder="Type here to search (Require Javascript)" class="search-input">
      </div>
      <button type="submit" class="search-btn-submit">Search</button>
    </form>
    <div class="search-result search-results"></div>
  </div>
</div>

{{- with resources.Get "js/search.js" }}
  {{- if eq hugo.Environment "development" }}
    {{- with . | js.Build }}
      <script src="{{ .RelPermalink }}" defer></script>
    {{- end }}
  {{- else }}
    {{- $opts := dict "minify" true }}
    {{- with . | js.Build $opts | fingerprint }}
      <script src="{{ .RelPermalink }}" integrity="{{- .Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{- end }}
  {{- end }}
{{- end }}
{{ end }}
