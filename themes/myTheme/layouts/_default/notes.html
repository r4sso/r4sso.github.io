{{ define "main" }}
<div style="padding: 16px 0;">
  <h1 class="section-title">{{ .Title }}</h1>
  <ul class="item-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">
        <span class="item-date">{{ .Date.Format "02 Jan 2006" }}</span>
        <span class="item-sep">—</span>
        <span>{{ .Title }}</span>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
