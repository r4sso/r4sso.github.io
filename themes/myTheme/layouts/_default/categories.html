{{ define "main" }}
<div style="padding: 16px 0;">
  <h1 class="section-title">{{ .Title }}</h1>
  <ul class="item-list">
    {{ range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}">
        <span class="item-date">{{ printf "%02d" .Count }} items</span>
        <span class="item-sep">—</span>
        <span>{{ .Name | strings.FirstUpper }}</span>
        <span class="item-section-badge">Category</span>
      </a>
    </li>
    {{ end }}
  </ul>
</div>
{{ end }}
