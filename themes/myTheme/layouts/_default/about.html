{{ define "main" }}
<div class="about-page">
  <header class="about-header">
    <div class="about-heading">
      <h1>{{ .Title }}</h1>
    </div>
  </header>

  {{ with .Params.thumb }}
  <div class="about-profile">
    <img
      class="about-thumb"
      src="{{ . }}"
      title="{{ $.Params.avatar_title }}"
      alt="{{ $.Title }}"
    >
  </div>
  {{ end }}

  <article class="about-content">
    {{ .Content }}
  </article>
</div>
{{ end }}
