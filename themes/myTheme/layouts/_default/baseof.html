<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" class="dark">
{{ partial "head.html" . }}
<body>
  <a href="#main" class="sr-only" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Skip to content</a>
  <header>
    {{ partial "header.html" . }}
  </header>

  <main id="main" class="site-main">
    {{ block "main" . }}{{ end }}
    {{ partial "scroll-top.html" . }}
    {{ partial "footer.html" . }}
  </main>

  {{ partial "script.html" . }}
</body>
</html>
